#友善 NanoPi R5C 固件云编译（OpenWrt 官方源码 openwrt-25.12）
name: R5C

on:
  #每天 05:00（北京时间）自动编译
  schedule:
    - cron: '0 21 * * *'
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '额外插件包，多个用\n分隔'
        required: false
        type: string
      TEST:
        description: '只生成配置，不编译固件'
        default: false
        required: false
        type: boolean

permissions: write-all

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: R5C
  #默认主题（第三方 eamonxg/luci-theme-shadcn）
  WRT_THEME: shadcn
  #默认主机名 / WIFI
  WRT_NAME: 狗鹏
  WRT_SSID: 狗鹏
  WRT_WORD: 12345678
  #默认地址
  WRT_IP: 192.168.1.1
  #默认 root 密码：留空（填「无」）则不设密码，此时 SSH / FTP 登不进
  WRT_PW: 12345678
  #SMB / FTP 是否对公网开放（false = 只在局域网）
  WRT_WAN_SHARE: 'true'
  #源码（OpenWrt 官方 25.12 稳定分支）
  WRT_REPO: https://github.com/openwrt/openwrt.git
  WRT_BRANCH: openwrt-25.12
  WRT_SOURCE: openwrt/openwrt
  #手动追加插件 / 仅生成配置
  WRT_PACKAGE: ${{github.event.inputs.PACKAGE}}
  WRT_TEST: ${{github.event.inputs.TEST}}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    #GitHub 单作业硬上限 6 小时，留出收尾时间
    timeout-minutes: 330
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq update
          sudo -E apt -yqq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget \
            dos2unix libfuse-dev python3-pyelftools python3-dev python3-yaml python3-pip libpython3-dev
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          #移除 project 的国内镜像（必须按 JSON 重写：按行 sed 会留下悬空逗号，download.pl 会 die）
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ] && command -v python3 >/dev/null 2>&1; then
            python3 - "$PROJECT_MIRRORS_FILE" <<'PY'
          import json, re, sys
          path = sys.argv[1]
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          pat = re.compile(r"\.cn/|tencent|aliyun", re.I)
          data = {k: [m for m in v if not pat.search(m)] for k, v in data.items()}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent="\t")
          PY
            echo "projectsmirrors.json: 国内镜像已移除"
          fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skiped done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc) && make clean -j$(nproc)

      - name: Verify Key Packages
        run: |
          cd ./wrt/

          EXPECTED="
          CONFIG_TARGET_DEVICE_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c
          CONFIG_PACKAGE_kmod-r8169
          CONFIG_PACKAGE_kmod-mt7921e
          CONFIG_PACKAGE_kmod-tcp-bbr
          CONFIG_PACKAGE_wpad-openssl
          CONFIG_PACKAGE_dnsmasq-full
          CONFIG_PACKAGE_adguardhome
          CONFIG_PACKAGE_luci-app-adguardhome
          CONFIG_PACKAGE_luci-theme-shadcn
          CONFIG_PACKAGE_luci-app-homeproxy
          CONFIG_PACKAGE_sing-box
          CONFIG_PACKAGE_ucode-mod-math
          CONFIG_PACKAGE_ddns-go
          CONFIG_PACKAGE_luci-app-ddns-go
          CONFIG_PACKAGE_luci-app-dockerman
          CONFIG_PACKAGE_luci-app-nlbwmon
          CONFIG_PACKAGE_samba4-server
          CONFIG_PACKAGE_vsftpd
          "
          MISSING=0
          for PKG in $EXPECTED; do
            if grep -q "^$PKG=y$" .config; then
              echo "  [OK]   $PKG"
            elif grep -q "^$PKG=m$" .config; then
              echo "  [WARN] $PKG = m（不会装进固件，请检查）"
            else
              echo "  [FAIL] $PKG 未进入 .config（依赖缺失，已被 defconfig 丢弃）"
              MISSING=1
            fi
          done

          if grep -q "^CONFIG_PACKAGE_luci-theme-shadcn=y$" .config; then
            echo "  [OK]   shadcn 主题已启用"
          fi

          #保险丝：官方 ruby 对 aarch64 默认开 YJIT，会去源码编 rust（实测 3 小时）；固件已无包依赖 ruby
          if grep -q "^CONFIG_RUBY_ENABLE_YJIT=y$" .config; then
            echo "::error::CONFIG_RUBY_ENABLE_YJIT=y —— 会触发 rust 编译器从源码编译(耗时 3 小时以上)，已中止"
            exit 1
          else
            echo "  [OK]   Ruby YJIT 未启用（当前固件不依赖 ruby）"
          fi

          #官方设备定义给 DEVICE_PACKAGES 写死了 wpad-basic-mbedtls，和 wpad-openssl 冲突（打镜像才炸）；
          #Config/R5C.txt 用 DEVICE_EXTRA_PACKAGES 的减号语法摘掉，这里确认那行活过了 defconfig。
          WPAFIX='CONFIG_TARGET_DEVICE_PACKAGES_rockchip_armv8_DEVICE_friendlyarm_nanopi-r5c="-wpad-basic-mbedtls -kmod-rtw88-8822ce -rtl8822ce-firmware"'
          if grep -qF "$WPAFIX" .config; then
            echo "  [OK]   R5C 设备包已移除 wpad-basic-mbedtls（不会再和 wpad-openssl 冲突）"
          else
            echo "::error::设备包移除配置没生效，打镜像时会因 wpad 包冲突失败，已中止"
            exit 1
          fi

          if [ "$MISSING" = "1" ]; then
            echo "::error::有插件没能进入 .config，已中止编译，避免编出缺插件的固件"
            exit 1
          fi

          #反向检查：不要的包不能被依赖悄悄拉回来。
          #注：ttyd 二进制不在清单里（dockerman 写死 +ttyd），只拦 LuCI 页面 luci-app-ttyd。
          FORBIDDEN="
          CONFIG_PACKAGE_luci-theme-openwrt-2020
          CONFIG_PACKAGE_luci-app-attendedsysupgrade
          CONFIG_PACKAGE_owut
          CONFIG_PACKAGE_luci-app-hd-idle
          CONFIG_PACKAGE_luci-app-smartdns
          CONFIG_PACKAGE_luci-app-https-dns-proxy
          CONFIG_PACKAGE_luci-app-ddns
          CONFIG_PACKAGE_luci-app-upnp
          CONFIG_PACKAGE_luci-app-wol
          CONFIG_PACKAGE_luci-app-sqm
          CONFIG_PACKAGE_luci-app-pbr
          CONFIG_PACKAGE_luci-app-openvpn
          CONFIG_PACKAGE_luci-proto-wireguard
          CONFIG_PACKAGE_luci-app-openclash
          CONFIG_PACKAGE_kmod-rtw88-8822ce
          CONFIG_PACKAGE_rtl8822ce-firmware
          CONFIG_PACKAGE_kmod-wireguard
          CONFIG_PACKAGE_luci-app-ttyd
          CONFIG_PACKAGE_luci-app-filemanager
          CONFIG_PACKAGE_luci-app-commands
          CONFIG_PACKAGE_luci-app-irqbalance
          CONFIG_PACKAGE_irqbalance
          CONFIG_PACKAGE_tailscale
          CONFIG_PACKAGE_luci-app-tailscale-community
          CONFIG_PACKAGE_luci-app-diskman
          CONFIG_PACKAGE_luci-app-samba4
          CONFIG_PACKAGE_hdparm
          CONFIG_PACKAGE_luci-theme-argon
          CONFIG_PACKAGE_luci-app-argon-config
          CONFIG_PACKAGE_luci-theme-liquid
          "
          EXTRA=0
          for PKG in $FORBIDDEN; do
            if grep -q "^$PKG=y$" .config; then
              echo "  [FAIL] $PKG 已被要求删除，但仍被别的包依赖拉进 .config"
              EXTRA=1
            fi
          done
          if [ "$EXTRA" = "0" ]; then
            echo "  [OK]   已删除的 $(echo $FORBIDDEN | wc -w) 个包都没被依赖拉回来"
          else
            echo "::error::有包被依赖拉回来了，不符合最精简的要求，已中止"
            exit 1
          fi

          make prereq -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc) || make download -j1 V=s

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make -j$(nproc) || make -j1 V=s

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

            make clean -j$(nproc)
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            友善 NanoPi R5C 专用固件（OpenWrt 官方源码编译）

            硬件：RK3568B2 / 4G LPDDR4X / 32G eMMC + microSD
            网口：2× 2.5G（RTL8125B，内核 r8169 驱动）
            无线：M.2 E-Key 插槽，已适配 MT7921（RTL8822CE 的驱动与固件已从设备包中移除）

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            配置：${{env.WRT_CONFIG}}
            平台：${{env.WRT_TARGET}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}
  cleanup:
    name: Clean Up
    runs-on: ubuntu-latest
    needs: build
    #TEST 模式不产 Release，也不清理
    if: always() && github.event.inputs.TEST != 'true'
    steps:
      - name: Delete Old Releases
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' |
            xargs -r -I {} gh release delete {} --cleanup-tag --yes

          gh run list --limit 100 --json databaseId,status \
            --jq '[.[] | select(.status == "completed")] | .[5:] | .[].databaseId' |
            xargs -r -I {} gh run delete {}
